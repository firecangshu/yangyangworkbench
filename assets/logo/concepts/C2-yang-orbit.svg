<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- C2 杨·轨：赤陶底 + 白色 Y 字 monogram + 墨蓝 AI 轨道 -->
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0625E"/>
      <stop offset="1" stop-color="#C24A46"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#c2bg)"/>
  <!-- AI 轨道（墨蓝椭圆环，压住对角线构图） -->
  <ellipse cx="512" cy="540" rx="330" ry="120" fill="none" stroke="#2C3E50" stroke-width="42"
           transform="rotate(-24 512 540)" opacity="0.95"/>
  <circle cx="806" cy="410" r="34" fill="#F0C05A"/>
  <!-- Y monogram：两笔斜杠汇聚 + 竖茎 -->
  <path d="M280 240 L512 560" stroke="#F5F1EA" stroke-width="120" stroke-linecap="round"/>
  <path d="M744 240 L512 560" stroke="#F5F1EA" stroke-width="120" stroke-linecap="round"/>
  <path d="M512 560 L512 810" stroke="#F5F1EA" stroke-width="120" stroke-linecap="round"/>
  <!-- 汇点火花 -->
  <circle cx="512" cy="560" r="26" fill="#F0C05A"/>
</svg>
