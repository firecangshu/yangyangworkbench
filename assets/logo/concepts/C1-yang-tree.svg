  <rect width="1024" height="1024" rx="230" fill="#2C3E50"/>
  <!-- 左杨（白） -->
  <path d="M318 330 C396 470 396 590 318 730 C240 590 240 470 318 330 Z" fill="#F5F1EA"/>
  <!-- 右杨（白） -->
  <path d="M706 330 C784 470 784 590 706 730 C628 590 628 470 706 330 Z" fill="#F5F1EA"/>
  <!-- 中杨（赤陶，最高） -->
  <path d="M512 180 C617 372 617 538 512 730 C407 538 407 372 512 180 Z" fill="#D9534F"/>
  <!-- 地平线 -->
  <rect x="220" y="758" width="584" height="26" rx="13" fill="#F5F1EA" opacity="0.9"/>
  <!-- 顶端四角星（金，悬于中杨树尖） -->
