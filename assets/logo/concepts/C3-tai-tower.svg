<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- C3 台·灯：墨蓝底 + 白色三层瞭望塔剪影 + 赤陶灯冠金芒 -->
  <rect width="1024" height="1024" rx="230" fill="#2C3E50"/>
  <!-- 塔身三层梯形，自下而上收窄 -->
  <path d="M330 810 L694 810 L654 640 L370 640 Z" fill="#F5F1EA"/>
  <path d="M382 610 L642 610 L606 460 L418 460 Z" fill="#F5F1EA"/>
  <path d="M428 430 L596 430 L566 300 L458 300 Z" fill="#F5F1EA"/>
  <!-- 塔冠（赤陶屋顶） -->
  <path d="M410 290 L614 290 L512 180 Z" fill="#D9534F"/>
  <!-- 灯与光芒 -->
  <circle cx="512" cy="365" r="34" fill="#F0C05A"/>
  <path d="M512 92 L524 124 L556 136 L524 148 L512 180 L500 148 L468 136 L500 124 Z" fill="#F0C05A"/>
  <!-- 塔身开窗（墨蓝负形） -->
  <rect x="486" y="480" width="52" height="90" rx="26" fill="#2C3E50"/>
</svg>
